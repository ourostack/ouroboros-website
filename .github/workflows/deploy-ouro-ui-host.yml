name: Deploy ouro-ui-host

# Deploys ui.ouroboros.bot's host Worker, ouro-ui-host (ourostack/ouro-ui site/host/), with no person in
# the loop. It runs here because this repository already holds the Cloudflare token for the
# ouroboros.bot zone, and ouro-ui has none. Every 15 minutes it compares the newest ouro-ui commit
# that touched site/host/ with the commit named in the live deployment's message, and deploys when
# they differ; run it by hand from the Actions tab to deploy now. Each run logs the live version as
# the rollback target, deploys, checks http → https with the query kept and HSTS, and rolls back if a
# check fails.
#
# Credentials: this repository's secret CLOUDFLARE_API_TOKEN (ourostack/ouroboros-website ›
# Settings › Secrets and variables › Actions), the same one deploy.yml uses.

on:
  schedule:
    - cron: "4,19,34,49 * * * *"
  workflow_dispatch:

concurrency:
  group: deploy-ouro-ui-host
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 4b157323bc7b08c0f6b0dc9c23b1e2b1
      # deploy --message needs a newer wrangler than this repository's own (4.59).
      WRANGLER: npx --yes wrangler@4.156.2
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Compare ouro-ui's site/host with the live deployment
        id: compare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(gh api "repos/ourostack/ouro-ui/commits?sha=main&path=site/host&per_page=1" --jq '.[0].sha')
          status=$($WRANGLER deployments status --name ouro-ui-host --json)
          field() { echo "$status" | node -e "const d=JSON.parse(require('fs').readFileSync(0,'utf8')); console.log($1 ?? '')"; }
          rollback=$(field 'd.versions[0].version_id')
          deployment=$(field 'd.annotations?.["workers/message"]')
          version=$($WRANGLER versions view "$rollback" --name ouro-ui-host --json | node -e 'const v=JSON.parse(require("fs").readFileSync(0,"utf8")); console.log(v.annotations?.["workers/message"] ?? "")')
          echo "site/host on ouro-ui main: $sha"
          echo "live version $rollback, message: ${version:-none}; deployment message: ${deployment:-none}"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "rollback=$rollback" >> "$GITHUB_OUTPUT"
          deploy=true
          if [ "${{ github.event_name }}" != workflow_dispatch ]; then
            if [ "$version" = "ouro-ui site/host $sha" ]; then
              deploy=false; echo "Up to date."
            elif echo "$deployment" | grep -qi '^rollback'; then
              # The live version was rolled back, by this workflow after a failed check or by a
              # person. Scheduled runs hold until someone runs this workflow by hand.
              deploy=false; echo "::warning::the live deployment is a rollback ($deployment); scheduled deploys hold until a manual run."
            fi
          fi
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.compare.outputs.deploy == 'true'
        with:
          repository: ourostack/ouro-ui
          ref: ${{ steps.compare.outputs.sha }}
          path: ouro-ui
          sparse-checkout: |
            site/host
            site/scripts/host-worker.test.mjs

      - name: Test the host Worker
        if: steps.compare.outputs.deploy == 'true'
        working-directory: ouro-ui
        run: node --test site/scripts/host-worker.test.mjs

      - name: Record the live version for rollback
        if: steps.compare.outputs.deploy == 'true'
        run: |
          $WRANGLER deployments list --name ouro-ui-host
          echo "Rollback target: ouro-ui-host version ${{ steps.compare.outputs.rollback }}"
          echo "ROLLBACK_ID=${{ steps.compare.outputs.rollback }}" >> "$GITHUB_ENV"

      - name: Deploy
        if: steps.compare.outputs.deploy == 'true'
        working-directory: ouro-ui/site/host
        run: $WRANGLER deploy --message "ouro-ui site/host ${{ steps.compare.outputs.sha }}"

      - name: Check http → https and HSTS
        if: steps.compare.outputs.deploy == 'true'
        run: |
          check() {
            local http https
            http=$(curl -sS -o /dev/null -D - "http://ui.ouroboros.bot/docs/?x=1" | tr -d '\r')
            https=$(curl -sS -o /dev/null -D - "https://ui.ouroboros.bot/docs/?x=1" | tr -d '\r')
            echo "== http";  echo "$http"  | grep -iE '^(HTTP/|location:|strict-transport-security:)'
            echo "== https"; echo "$https" | grep -iE '^(HTTP/|location:|strict-transport-security:)'
            echo "$http"  | grep -qE '^HTTP/[0-9.]+ 301' &&
            echo "$http"  | grep -qi '^location: https://ui\.ouroboros\.bot/docs/?x=1$' &&
            echo "$http"  | grep -qi '^strict-transport-security: max-age=' &&
            echo "$https" | grep -qE '^HTTP/[0-9.]+ 200' &&
            echo "$https" | grep -qi '^strict-transport-security: max-age='
          }
          for attempt in 1 2 3 4 5 6; do
            sleep 10
            if check; then echo "Checks pass."; exit 0; fi
          done
          echo "::error::ui.ouroboros.bot failed its http → https or HSTS check"; exit 1

      # Any failure or cancellation after the live version was recorded puts it back. After a failed
      # deploy this restores the version that is already live, which is harmless.
      - name: Roll back
        if: (failure() || cancelled()) && env.ROLLBACK_ID != ''
        run: |
          $WRANGLER rollback "$ROLLBACK_ID" --name ouro-ui-host --message "rollback after ouro-ui site/host ${{ steps.compare.outputs.sha }}" --yes
