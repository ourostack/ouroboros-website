# Temporary: proves the seams check 10 times out of 10 on this build (#442). Removed before the pull request opens.
name: seams-repeat
on:
  push:
    branches: [fix/seams-wait-for-images]
permissions:
  contents: read
jobs:
  repeat:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Chromium and its Ubuntu packages
        uses: ./.github/actions/chromium
      - run: npm run build
      - name: check:seams, 10 times
        run: |
          passed=0
          for i in $(seq 1 10); do
            if npm run --silent check:seams > "seams-$i.log" 2>&1; then passed=$((passed + 1)); echo "run $i: pass: $(head -1 "seams-$i.log")"; else echo "run $i: FAIL"; cat "seams-$i.log"; fi
          done
          echo "check:seams passed $passed of 10"
          [ "$passed" = 10 ]
