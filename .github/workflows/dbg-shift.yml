name: dbg-shift
on: pull_request
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: the real shard 4/6
        run: |
          node scripts/ouro/check/check.ts dist --sizes 390x844,1440x900,3840x2160 --out oc --shard 4/6 > oc.log 2>&1 || true
          python3 -c "
          import json;d=json.load(open('oc/report.json'))
          print('SHIFTS',[ (f['page'],f['width'],f['theme'],f.get('value'),f['element'][:60]) for f in d['findings'] if f['rule']=='layout-shift'])"
