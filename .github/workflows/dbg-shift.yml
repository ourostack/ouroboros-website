name: dbg-shift
on: pull_request
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: check approach repeatedly, with and without load
        run: |
          for i in 1 2 3 4 5 6; do
            if [ "${{ matrix.n }}" -gt 2 ]; then (for c in 1 2; do timeout 40 sh -c 'while :; do :; done' & done) ; fi
            echo "RUN $i load=${{ matrix.n }}"
            node scripts/ouro/check/check.ts dist --pages /approach/ --sizes 1440x900 --themes light --no-axe --out oc$i > oc$i.log 2>&1 || true
            grep -h "layout-shift\|layout shift" oc$i.log | head -3
            python3 -c "
          import json;d=json.load(open('oc$i/report.json'))
          print([ (f['rule'],f.get('value')) for f in d['findings'] if f['rule']=='layout-shift'])"
          done
