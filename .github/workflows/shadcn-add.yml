name: shadcn-add

# Runs shadcn add for Ouro UI items on a branch, in CI (the laptop's npm proxy
# lacks packages), and uploads the result as a patch to review and apply by
# hand: shots/shadcn.json is { ref, tag, items: [...] }. Lives only on the
# pr-proof branch; it pushes nothing.

on:
  push:
    branches: [pr-proof]
    paths: [shots/shadcn.json]

permissions:
  contents: read

jobs:
  add:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - id: req
        run: |
          echo "ref=$(jq -r .ref shots/shadcn.json)" >> "$GITHUB_OUTPUT"
          echo "tag=$(jq -r .tag shots/shadcn.json)" >> "$GITHUB_OUTPUT"
          echo "items=$(jq -r '.items | join(" ")' shots/shadcn.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.req.outputs.ref }}
          path: site
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - working-directory: site
        env:
          TAG: ${{ steps.req.outputs.tag }}
          ITEMS: ${{ steps.req.outputs.items }}
        run: |
          set -o pipefail
          npm ci --no-audit --no-fund
          mkdir -p ../out
          for item in $ITEMS; do
            echo "::group::add $item#$TAG"
            npx --yes shadcn@latest add "ourostack/ouro-ui/$item#$TAG" --overwrite --yes 2>&1 | tee -a ../out/shadcn.log
            echo "::endgroup::"
          done
          git add -A
          git diff --cached --stat | tee ../out/stat.txt
          git diff --cached --binary > ../out/shadcn.patch
      - uses: actions/upload-artifact@v4
        with:
          name: shadcn
          path: out/
