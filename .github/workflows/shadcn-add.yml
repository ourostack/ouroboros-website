name: shadcn-add

# Installs registry items into a branch in CI, so no laptop runs an install:
# checks out the ref named in shots/shadcn-add.json, runs npm ci and
# `npx shadcn add` with the items named there, and uploads every changed or new
# file (with `git diff --stat`) as the `shadcn-add` artifact.

on:
  push:
    branches: [pr-proof]
    paths: [shots/shadcn-add.json]

permissions:
  contents: read

jobs:
  add:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: proof
      - id: req
        run: |
          echo "ref=$(jq -r .ref proof/shots/shadcn-add.json)" >> "$GITHUB_OUTPUT"
          echo "items=$(jq -r '.items | join(" ")' proof/shots/shadcn-add.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.req.outputs.ref }}
          path: site
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - working-directory: site
        run: |
          npm ci --no-audit --no-fund
          npx --yes shadcn@latest add ${{ steps.req.outputs.items }} --yes --overwrite 2>&1 | tee ../shadcn.log
          git add -A
          git --no-pager diff --cached --stat | tee ../diffstat.txt
          mkdir -p ../out
          git diff --cached --name-only -z | xargs -0 -I{} sh -c 'mkdir -p "../out/$(dirname "{}")" && cp "{}" "../out/{}"'
          cp ../shadcn.log ../diffstat.txt ../out/
      - uses: actions/upload-artifact@v4
        with:
          name: shadcn-add
          path: out/
