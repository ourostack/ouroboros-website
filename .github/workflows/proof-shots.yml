name: proof-shots

# Proof screenshots for pull requests, taken in CI so no laptop has to: each
# push that changes shots/request.json shoots every base it names (the live
# site, a PR preview) at phone 390x844 and laptop 1440x900, light and dark,
# and uploads them as the `shots` artifact. Lives only on the pr-proof branch.

on:
  push:
    branches: [pr-proof]
    paths: [shots/request.json]

permissions:
  contents: read

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i --no-save --no-package-lock playwright@1.56.1 && npx playwright install --with-deps chromium
      - run: node shots/shoot.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: shots
          path: out/
