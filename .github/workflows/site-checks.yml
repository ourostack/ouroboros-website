name: site-checks

# Every PR and every push to main builds the site, runs the node tests, serves
# the build on 127.0.0.1 the way the Worker does (scripts/serve-dist.mjs), and
# runs every page check (npm run check:all) and the brand audit
# (ourostack/.github brand/tools/audit.mjs --origin --dist) against it. Beside
# it, Ouro check (lib/ouro/check, from Ouro UI) walks every page of the same
# build at 390x844, 1440x900 and 3840x2160 in light and dark, in four shards;
# ouro-check.json holds its waivers and budgets. Each shard first proves
# lib/ouro/check is byte for byte Ouro UI's release at OURO_UI_TAG. Time to the
# largest content (LCP) is gated at a budget wide enough for the runners' noise;
# taste reviewers then judge only what a tool can't measure. The agent bundle job
# proves the public demo bundle in public/agent-loop/ installs from the public npm
# registry with a cold npm ci and passes its own tests on Linux, Windows and macOS.
#
# The last job is named site-checks so it stays the one required check on
# main: it passes only when the page checks, the agent bundle and every Ouro check
# shard pass.

on:
  pull_request:
  push:
    branches: [main]

# A newer push to a pull request cancels its older run. Runs not triggered by a pull request each
# get their own group, so they are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# The Ouro UI release this site's Ouro items come from. Reinstall them from a new
# tag before changing it here.
env:
  OURO_UI_TAG: v1.3.10

jobs:
  pages:
    name: page checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SITE_BASE: http://127.0.0.1:4321
      CHECK_LOGS: ${{ github.workspace }}/check-logs
      CHECK_JOBS: 2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Cache Playwright's Chromium
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium and its OS dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Chromium's OS dependencies (browser cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Build and node tests (npm test)
        id: test
        continue-on-error: true
        run: |
          mkdir -p "$CHECK_LOGS"
          set -o pipefail
          npm test 2>&1 | tee "$CHECK_LOGS/npm-test.log"

      - name: Serve the build on 127.0.0.1
        id: serve
        run: |
          test -f dist/index.html
          nohup node scripts/serve-dist.mjs --port 4321 > "$CHECK_LOGS/serve-dist.log" 2>&1 &
          for i in $(seq 1 50); do curl -fsS -o /dev/null "$SITE_BASE/" && exit 0; sleep 0.2; done
          echo "dist/ did not come up on $SITE_BASE" && exit 1

      - name: Page checks (npm run check:all)
        id: checks
        continue-on-error: true
        run: npm run check:all

      - name: Check out ourostack/.github main for the brand audit
        uses: actions/checkout@v4
        with:
          repository: ourostack/.github
          ref: main
          path: .brand-dotgithub
          persist-credentials: false

      - name: Brand audit against this build
        id: audit
        continue-on-error: true
        run: |
          set -o pipefail
          node .brand-dotgithub/brand/tools/audit.mjs --only site:ouroboros.bot --origin "$SITE_BASE" --dist dist --format text 2>&1 | tee "$CHECK_LOGS/brand-audit.log"

      - name: Upload check logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-checks-logs
          path: check-logs/
          if-no-files-found: warn

      - name: Summary
        if: always()
        run: |
          line() { printf '%-28s %s\n' "$1" "$2"; }
          {
            echo "## site-checks"
            echo '```'
            line "npm test" "${{ steps.test.outcome }}"
            line "serve dist" "${{ steps.serve.outcome }}"
            line "check:all" "${{ steps.checks.outcome }}"
            [ -f check-logs/summary.txt ] && sed 's/^/  /' check-logs/summary.txt
            line "brand audit" "${{ steps.audit.outcome }}"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          for o in "${{ steps.test.outcome }}" "${{ steps.serve.outcome }}" "${{ steps.checks.outcome }}" "${{ steps.audit.outcome }}"; do
            [ "$o" = success ] || { echo "page checks failed: see the steps above and the site-checks-logs artifact"; exit 1; }
          done

  ouro-check:
    name: ouro check ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Cache Playwright's Chromium
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium and its OS dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Chromium's OS dependencies (browser cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Check out Ouro check from Ouro UI ${{ env.OURO_UI_TAG }}
        uses: actions/checkout@v4
        with:
          repository: ourostack/ouro-ui
          ref: ${{ env.OURO_UI_TAG }}
          path: .ouro-ui
          sparse-checkout: registry/ouro/check
          persist-credentials: false

      - name: lib/ouro/check is Ouro UI ${{ env.OURO_UI_TAG }}'s
        run: diff -r .ouro-ui/registry/ouro/check lib/ouro/check

      - run: npm run build

      # Exits 0 when clean and 3 on findings; each finding has a captioned close-up in findings/.
      - name: Ouro check, shard ${{ matrix.shard }} of 4
        run: node lib/ouro/check/check.ts dist --sizes 390x844,1440x900,3840x2160 --out ouro-check --shard ${{ matrix.shard }}/4

      - name: Summary
        if: ${{ !cancelled() }}
        run: '[ -f ouro-check/summary.md ] && cat ouro-check/summary.md >> "$GITHUB_STEP_SUMMARY" || true'

      - name: Upload the report and the findings' close-ups
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ouro-check-${{ matrix.shard }}-of-4
          path: |
            ouro-check/report.json
            ouro-check/summary.md
            ouro-check/findings
          if-no-files-found: warn

  agent-bundle:
    name: agent bundle
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22.18.0', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: The lockfile is version 2 or later, and every resolved URL in it is the public npm registry
        shell: bash
        working-directory: public/agent-loop
        run: |
          node -e 'const lock = JSON.parse(require("fs").readFileSync("package-lock.json", "utf8")); if (!(lock.lockfileVersion >= 2)) { console.error("lockfileVersion " + lock.lockfileVersion + " is older than 2"); process.exit(1); } const bad = Object.entries(lock.packages || {}).filter(([, p]) => p.resolved && !p.resolved.startsWith("https://registry.npmjs.org/")); if (bad.length) { for (const [name, p] of bad) console.error(name + " -> " + p.resolved); process.exit(1); }'

      - name: npm ci
        working-directory: public/agent-loop
        run: npm ci

      - name: npm test
        working-directory: public/agent-loop
        run: npm test

  site-checks:
    name: site-checks
    needs: [pages, agent-bundle, ouro-check]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: The page checks, the agent bundle and every Ouro check shard pass
        run: |
          echo "page checks: ${{ needs.pages.result }}"
          echo "agent bundle: ${{ needs.agent-bundle.result }}"
          echo "ouro check:  ${{ needs.ouro-check.result }}"
          [ "${{ needs.pages.result }}" = success ] && [ "${{ needs.agent-bundle.result }}" = success ] && [ "${{ needs.ouro-check.result }}" = success ]
