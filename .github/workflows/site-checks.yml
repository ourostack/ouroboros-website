name: site-checks

# Every PR and every push to main builds the site and runs every gate on it, in
# parallel jobs so the run is only as long as its longest share:
#   - tests: npm test (the build and the node tests), then serves the build on
#     127.0.0.1 the way the Worker does (scripts/serve-dist.mjs) and runs the
#     brand audit (ourostack/.github brand/tools/audit.mjs --origin --dist) from a
#     checkout of the commit brand-pin.json records, so main's brand moving never
#     turns this run red; the sync-brand workflow moves the pin with the art.
#   - pages: every page check (npm run check:all) against the same build,
#     split into four shards by measured time (scripts/check-shards.mjs).
#   - ouro-check: Ouro check (from Ouro UI, where .github/ouro-hx-installed.json puts it) walks every page at
#     390x844, 1440x900 and 3840x2160 in light and dark, in six shards;
#     ouro-check.json holds its waivers and budgets. Each shard first proves
#     Ouro check's folder, and each file of the AX kit it runs on,
#     is byte for byte Ouro UI's release named by the tag in
#     .github/ouro-hx-installed.json. Time to the largest content (LCP) is
#     gated at a budget wide enough for the runners' noise; taste reviewers
#     then judge only what a tool can't measure.
# tests/check-shards.test.mjs fails when a matrix drops a shard.
#
# The last job is named site-checks so it stays the one required check on
# main: it passes only when the tests and every page and Ouro check shard pass.
# It also times the run (scripts/ci-budget.mjs): each job's wait and work go to
# the step summary, and on a pull request it fails when the critical path, the
# longest job timed from its own start, is over 7 minutes. On main it only
# reports and records an overrun in one issue. tests/ci-budget.test.mjs fails
# when a new check job is missing from its needs.
# On a pull request a failed shard cancels its siblings; main always runs whole.
# refresh-ouromd-release.yml dispatches it on the pull requests it opens, since
# a pull request opened with a workflow's own token starts no pull_request run.
# Ouro Current sends an ouro-current-full-run repository_dispatch event, with the
# commit as client_payload.sha, when a failing shard cancelled the others on its
# update pull request: only the Ouro check shards run, all of them, on that
# commit, and their artifacts end in -full-<sha> so Ouro Current can find them
# (the run itself is on main). No other job runs, so main's checks are untouched.
#
# It is also the only way production deploys (deploy.yml), on main only. On a
# push, deploy-early goes at once when the proof job shows this exact tree
# already passed site-checks on its own pull request (scripts/tested-tree.mjs;
# every gap fails closed). Otherwise, or when that deploy fails, deploy goes
# after main's own checks pass. Main runs every check either way. Only main's
# head deploys; a deploy that skips confirms the head deploys, and otherwise
# dispatches this workflow on main (scripts/deploy-head.mjs).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [ouro-current-full-run]

# A newer push to a pull request cancels its older run. Runs not triggered by a pull request each
# get their own group, so they are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  tests:
    name: tests and brand audit
    if: github.event_name != 'repository_dispatch'
    runs-on: ubuntu-latest
    # About twice the usual 1.5 minutes, with room for a slow apt mirror.
    timeout-minutes: 5
    env:
      SITE_BASE: http://127.0.0.1:4321
      CHECK_LOGS: ${{ github.workspace }}/check-logs
      # tests/brand-audit.test.mjs runs the audit from this checkout, at the pinned commit.
      BRAND_DOTGITHUB: ${{ github.workspace }}/.brand-dotgithub
    steps:
      - uses: actions/checkout@v4

      # The tree this pull request run checks out (its merge with main). When
      # the pull request lands as a commit with this exact tree, the proof job
      # finds this artifact and main deploys without waiting for its own run.
      - name: Record the tree this run tests
        id: tree
        if: github.event_name == 'pull_request'
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          echo "$tree" > "$RUNNER_TEMP/tested-tree.txt"
          echo "sha=$tree" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: tested-tree-${{ steps.tree.outputs.sha }}
          path: ${{ runner.temp }}/tested-tree.txt
          retention-days: 1
          overwrite: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The brand audit judges the site's copies against the ourostack/.github commit brand-pin.json
      # records, not against main, so a brand merge on main cannot turn this job red. A missing or
      # malformed pin fails here with the fix (scripts/brand-pin.mjs).
      - name: Read the brand pin
        id: pin
        run: echo "commit=$(node scripts/brand-pin.mjs commit)" >> "$GITHUB_OUTPUT"

      - name: Check out ourostack/.github at the brand pin
        uses: actions/checkout@v4
        with:
          repository: ourostack/.github
          ref: ${{ steps.pin.outputs.commit }}
          path: .brand-dotgithub
          persist-credentials: false

      - run: npm ci

      - name: Cache Playwright's Chromium
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium and its OS dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Chromium's OS dependencies (browser cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Build and node tests (npm test)
        id: test
        continue-on-error: true
        run: |
          mkdir -p "$CHECK_LOGS"
          set -o pipefail
          npm test 2>&1 | tee "$CHECK_LOGS/npm-test.log"

      - name: Serve the build on 127.0.0.1
        id: serve
        run: |
          test -f dist/index.html
          mkdir -p "$CHECK_LOGS"
          nohup node scripts/serve-dist.mjs --port 4321 > "$CHECK_LOGS/serve-dist.log" 2>&1 &
          for _ in $(seq 1 50); do curl -fsS -o /dev/null "$SITE_BASE/" && exit 0; sleep 0.2; done
          echo "dist/ did not come up on $SITE_BASE" && exit 1

      - name: Brand audit against this build
        id: audit
        continue-on-error: true
        run: |
          set -o pipefail
          node .brand-dotgithub/brand/tools/audit.mjs --only site:ouroboros.bot --origin "$SITE_BASE" --dist dist --format text 2>&1 | tee "$CHECK_LOGS/brand-audit.log"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-checks-logs-tests
          path: check-logs/
          if-no-files-found: warn

      - name: Summary
        if: always()
        run: |
          line() { printf '%-28s %s\n' "$1" "$2"; }
          {
            echo "## tests and brand audit"
            echo '```'
            line "npm test" "${{ steps.test.outcome }}"
            line "serve dist" "${{ steps.serve.outcome }}"
            line "brand audit" "${{ steps.audit.outcome }}"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          for o in "${{ steps.test.outcome }}" "${{ steps.serve.outcome }}" "${{ steps.audit.outcome }}"; do
            [ "$o" = success ] || { echo "failed: see the steps above and the site-checks-logs-tests artifact"; exit 1; }
          done

  pages:
    name: page checks ${{ matrix.shard }}/4
    if: github.event_name != 'repository_dispatch'
    runs-on: ubuntu-latest
    # About twice the usual 2.5 minutes. A hung check is killed after
    # CHECK_TIMEOUT (240 seconds) and named before this.
    timeout-minutes: 6
    strategy:
      fail-fast: ${{ github.event_name == 'pull_request' }}
      matrix:
        shard: [1, 2, 3, 4]
    env:
      SHARDS: 4
      SITE_BASE: http://127.0.0.1:4321
      CHECK_LOGS: ${{ github.workspace }}/check-logs
      CHECK_JOBS: 2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Cache Playwright's Chromium
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium and its OS dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Chromium's OS dependencies (browser cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - run: npm run build

      - name: Serve the build on 127.0.0.1
        id: serve
        run: |
          test -f dist/index.html
          mkdir -p "$CHECK_LOGS"
          nohup node scripts/serve-dist.mjs --port 4321 > "$CHECK_LOGS/serve-dist.log" 2>&1 &
          for _ in $(seq 1 50); do curl -fsS -o /dev/null "$SITE_BASE/" && exit 0; sleep 0.2; done
          echo "dist/ did not come up on $SITE_BASE" && exit 1

      - name: Page checks, shard ${{ matrix.shard }} of 4
        run: npm run check:all -- --shard "${{ matrix.shard }}/$SHARDS"

      - name: Summary
        if: always()
        run: |
          [ -f check-logs/summary.txt ] || exit 0
          { echo "## page checks ${{ matrix.shard }}/4"; echo '```'; cat check-logs/summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-checks-logs-${{ matrix.shard }}-of-4
          path: check-logs/
          if-no-files-found: warn

  ouro-check:
    name: ouro check ${{ matrix.shard }}/6
    runs-on: ubuntu-latest
    # About twice the usual 2.5 minutes per shard.
    timeout-minutes: 6
    strategy:
      fail-fast: ${{ github.event_name == 'pull_request' }}
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    env:
      SHARDS: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.sha || '' }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Cache Playwright's Chromium
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium and its OS dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Chromium's OS dependencies (browser cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # The Ouro UI release this site's Ouro items come from is the tag in their install record, which Ouro Current
      # moves with the items. It is read here rather than written in this file, because an app may not write a workflow.
      - name: Read the Ouro UI release from the install record
        run: echo "OURO_UI_TAG=$(jq -er .tag .github/ouro-hx-installed.json)" >> "$GITHUB_ENV"

      - name: Check out Ouro check from Ouro UI ${{ env.OURO_UI_TAG }}
        uses: actions/checkout@v4
        with:
          repository: ourostack/ouro-ui
          ref: ${{ env.OURO_UI_TAG }}
          path: .ouro-ui
          sparse-checkout: |
            registry/ouro/check
            registry/ouro/ax
          persist-credentials: false

      # The install record says where Ouro check and the AX kit are, so a release that moves them (Ouro UI put Ouro
      # check under scripts/ouro/ after v1.3.241) needs no change here.
      - name: Ouro check and its AX kit are Ouro UI ${{ env.OURO_UI_TAG }}'s
        run: |
          check="$(dirname "$(jq -er '.files | keys[] | select(endswith("/check/check.ts"))' .github/ouro-hx-installed.json)")"
          echo "OURO_CHECK=$check/check.ts" >> "$GITHUB_ENV"
          diff -r .ouro-ui/registry/ouro/check "$check"
          jq -r '.files | keys[] | select(test("(^|/)ouro/ax/[^/]+$"))' .github/ouro-hx-installed.json | while read -r f; do cmp ".ouro-ui/registry/ouro/ax/$(basename "$f")" "$f"; done

      - run: npm run build

      # Exits 0 when clean and 3 on findings; each finding has a captioned close-up in findings/.
      - name: Ouro check, shard ${{ matrix.shard }} of 6
        run: node "$OURO_CHECK" dist --sizes 390x844,1440x900,3840x2160 --out ouro-check --shard "${{ matrix.shard }}/$SHARDS"

      - name: Summary
        if: ${{ !cancelled() }}
        run: '[ -f ouro-check/summary.md ] && cat ouro-check/summary.md >> "$GITHUB_STEP_SUMMARY" || true'

      - name: Upload the report and the findings' close-ups
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ouro-check-${{ matrix.shard }}-of-6${{ github.event.client_payload.sha && format('-full-{0}', github.event.client_payload.sha) || '' }}
          path: |
            ouro-check/report.json
            ouro-check/summary.md
            ouro-check/findings
          if-no-files-found: warn

  site-checks:
    name: site-checks
    needs: [tests, pages, ouro-check]
    if: always() && github.event_name != 'repository_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - name: The tests and every page and Ouro check shard pass
        run: |
          echo "tests:       ${{ needs.tests.result }}"
          echo "page checks: ${{ needs.pages.result }}"
          echo "ouro check:  ${{ needs.ouro-check.result }}"
          [ "${{ needs.tests.result }}" = success ] && [ "${{ needs.pages.result }}" = success ] && [ "${{ needs.ouro-check.result }}" = success ]

      - uses: actions/checkout@v4
        if: ${{ !cancelled() }}
        with:
          sparse-checkout: scripts/ci-budget.mjs
          sparse-checkout-cone-mode: false

      - name: The critical path is within its 7 minute budget
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          BUDGET_OWNER: arimendelow
        run: node scripts/ci-budget.mjs

  # On a push to main: did this exact tree, workflows included, already pass
  # site-checks on its own pull request? scripts/tested-tree.mjs answers
  # tested=true only when every condition holds and false on any gap.
  proof:
    name: tree already tested on its pull request
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      tested: ${{ steps.proof.outputs.tested }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/tested-tree.mjs
          sparse-checkout-cone-mode: false

      - id: proof
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/tested-tree.mjs

  deploy-early:
    name: production deploy (tree tested on its pull request)
    needs: proof
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.proof.outputs.tested == 'true'
    permissions:
      actions: write
      contents: read
      deployments: write
    uses: ./.github/workflows/deploy.yml
    secrets: inherit

  # Main still runs every gate. When the tree wasn't proven, or the early
  # deploy failed, production deploys only after those gates pass.
  deploy:
    name: production deploy (after main's checks)
    needs: [site-checks, deploy-early]
    if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.site-checks.result == 'success' && needs.deploy-early.result != 'success'
    permissions:
      actions: write
      contents: read
      deployments: write
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
